[workspace]
members = [
    "tools/xtask",
    "crates/unwasm-core",
    "crates/unwasm-cli",
]
default-members = ["crates/unwasm-core", "crates/unwasm-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
# The decompiler uses let-chains, stabilized in Rust 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
unwasm-core = { path = "crates/unwasm-core" }
wa-store = { git = "https://github.com/oxidezap/whatspec.git", rev = "76a27470124eaaa70eedba584274c83adfda701e" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Static inspection, shared by both halves. Nothing here compiles or decodes a
# module body, which is what keeps `oracle inspect` instant on a 10 MB file.
wasmparser = { version = "0.254", default-features = false, features = ["std", "validate"] }

[workspace.lints.rust]
# The decompiler and what it emits are plain safe Rust: linear memory is a
# `Vec<u8>` and every access is bounds-checked. A decompiler that needs `unsafe`
# to model wasm has modelled it wrong.
#
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The generated code is compiled by the test harness on every run, so a slow
# debug build is felt on every iteration, not only in release.
[profile.dev]
opt-level = 1
