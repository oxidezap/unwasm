[workspace]
members = ["crates/unwasm-core", "crates/unwasm-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
unwasm-core = { path = "crates/unwasm-core" }

[workspace.lints.rust]
# The generated code is plain safe Rust: linear memory is a `Vec<u8>` and every
# access is bounds-checked. A decompiler that needs `unsafe` to model wasm has
# modelled it wrong.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The generated code is compiled by the test harness on every run, so a slow
# debug build is felt on every iteration, not only in release.
[profile.dev]
opt-level = 1
