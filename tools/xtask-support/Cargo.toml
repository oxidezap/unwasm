[package]
name = "xtask-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license.workspace = true

[features]
default = []
compression = ["dep:zstd"]
download = ["dep:ureq", "dep:url", "dep:tar", "dep:xz2"]

[dependencies]
anyhow = "1"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
zstd = { version = "0.13.3", optional = true }
ureq = { version = "3.3", default-features = false, features = ["rustls"], optional = true }
url = { version = "2.5", optional = true }
tar = { version = "0.4", optional = true }
xz2 = { version = "0.1", optional = true }
tempfile = "3"

[lints]
workspace = true
