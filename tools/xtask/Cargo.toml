[package]
name = "unwasm-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
wa-store = { git = "https://github.com/oxidezap/whatspec.git", rev = "10a66fdaab616c9ef6b3f5e6b197bdddfabc142a" }
