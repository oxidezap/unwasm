[package]
name = "oracle-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Command line front-end for oracle-core"

[[bin]]
name = "oracle"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
oracle-core = { workspace = true }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
