name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday, early. Only the `captures` job has anything to do here.
    - cron: '17 5 * * 1'

env:
  CARGO_TERM_COLOR: always
  # See the install step: which frames the analysis can see is a property of
  # the compiler that built the fixture.
  CLANG_VERSION: '22'
  # The Emscripten the `captures` tier builds its signature reference with. A
  # fingerprint matches ~91% across builds of one toolchain and a handful across
  # versions, so which version produced the reference is part of the result.
  EMSCRIPTEN_VERSION: '6.0.6'
  # The harness compiles generated Rust on every run, so a slow debug build is
  # felt on every test, not only in release.
  CARGO_INCREMENTAL: 0

jobs:
  # Everything a checkout can verify about itself: no network, no captures.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The reference engine. Every differential test runs the same calls here
      # and in the generated Rust, and compares both against each other.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # clang builds the wasm32 C fixtures; wasm-ld comes from lld and clang
      # will not link `--target=wasm32` without it.
      #
      # The version is pinned, and that is not tidiness. `match_prologue` knows
      # four spellings of the shadow-stack prologue, each found by reading what
      # clang actually emits at -O0 — so which frames the analysis can see is a
      # property of the compiler that built the fixture. The frame tests pass
      # under clang 18 and 22 now that the fourth spelling is known, and pinning
      # says which of those two a green run measured. A fifth compiler may well
      # have a fifth spelling, and a pin is what turns that into a deliberate
      # change rather than a runner image moving underneath the tests.
      - name: Install clang ${{ env.CLANG_VERSION }} and lld
        run: |
          sudo apt-get update
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo apt-get install -y "lld-$CLANG_VERSION"
          # The harness runs `clang` and `wasm-ld` by bare name, so the pinned
          # build has to be what those names resolve to.
          mkdir -p "$HOME/.local/bin"
          ln -sf "/usr/bin/clang-$CLANG_VERSION" "$HOME/.local/bin/clang"
          ln -sf "/usr/bin/wasm-ld-$CLANG_VERSION" "$HOME/.local/bin/wasm-ld"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install wasm-tools
        run: |
          version=1.254.0
          url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/wasm-tools-${version}-x86_64-linux.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xz --strip-components=1 -C "$HOME/.local/bin" \
            "wasm-tools-${version}-x86_64-linux/wasm-tools"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the tools the harness needs are all runnable
        # A missing tool fails the tests rather than skipping them, so proving
        # they are here first turns "the harness could not run" into its own
        # error rather than into a test failure that reads like a real one.
        run: |
          node --version
          clang --version | head -1
          wasm-ld --version
          wasm-tools --version
          rustc --version
          # The pin is the point, so a silent fallback to the distribution's
          # clang would defeat it.
          clang --version | head -1 | grep -q "clang version $CLANG_VERSION\." \
            || { echo "clang is not the pinned major version $CLANG_VERSION" >&2; exit 1; }

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy --manifest-path tools/xtask/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path tools/xtask/Cargo.toml --locked

  # The tier that needs the real modules: ~19 MB of captures to download, so it
  # does not run on every push. Start it by hand from the Actions tab, or let
  # the weekly run take it. whatspec's wa-store restores each file by its
  # pinned content identity, independent of the current live rollout.
  captures:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The reference engine, for the one test in this tier that runs a capture
      # rather than reading it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The catalogue test builds its reference module with Emscripten, so this
      # tier needs the toolchain the captures were built with. Installed from
      # the SDK rather than from an action, and pinned, for the same reason
      # clang is: which functions a fingerprint recognises is a property of the
      # compiler that produced the reference.
      - name: Install Emscripten ${{ env.EMSCRIPTEN_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSCRIPTEN_VERSION"
          ~/emsdk/emsdk activate "$EMSCRIPTEN_VERSION"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Fetch the captures
        run: cargo xt fetch-captures

      # The whole tier, including the tests that hand generated Rust back to
      # rustc. It used to be thirty-one minutes and only the decompilation was
      # worth running here; counting the index's line numbers forward instead of
      # recounting the whole output made it under a minute, and what had been
      # left out is the part that actually runs a capture.
      - name: Every capture, decompiled — and one of them run
        run: cargo test --test captured -- --ignored --nocapture

      - name: "Large Emscripten corpus: host, names, registrations and trampolines"
        run: |
          cargo test --test host --test names --test embind --test trampolines \
            -- --ignored --nocapture

      # The toolchain tier. It needs no captures, only `emcc` — which is why it
      # runs here rather than in `check`, and why it ran nowhere before.
      - name: What the real toolchain emits
        run: cargo test --test emscripten -- --ignored --nocapture
