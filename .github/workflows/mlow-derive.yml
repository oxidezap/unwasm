name: MLOW capture derivation

on:
  push:
    paths: ['crates/oracle-*/**', 'tools/xtask/**', 'tools/xtask-support/**', '.cargo/config.toml', 'specs/**', 'wasm.lock.json', 'Cargo.lock', '.github/workflows/mlow-derive.yml']
  pull_request:
    paths: ['crates/oracle-*/**', 'tools/xtask/**', 'tools/xtask-support/**', '.cargo/config.toml', 'specs/**', 'wasm.lock.json', 'Cargo.lock', '.github/workflows/mlow-derive.yml']
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        capture: [JgwtTQVeWPm, S_ivh1PriOA]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build pinned oracle dependencies
        run: cargo build --release --locked -p unwasm-xtask
      - name: Test derivation and migration
        run: cargo test --release --locked -p oracle-core --lib
      - name: Test Rust task utilities
        run: cargo test --release --locked -p unwasm-xtask -p xtask-support --all-features
      - name: Re-derive every output for this capture
        run: cargo xt mlow verify --capture '${{ matrix.capture }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlow-${{ matrix.capture }}-evidence
          path: |
            .derive-mlow/*.log
            .derive-mlow/*/manifest.json
          if-no-files-found: error
          include-hidden-files: true
