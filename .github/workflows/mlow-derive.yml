name: MLOW capture derivation

on:
  push:
    paths: ['crates/oracle-*/**', 'scripts/mlow/**', 'specs/**', 'wasm.lock.json', 'Cargo.lock', '.github/workflows/mlow-derive.yml']
  pull_request:
    paths: ['crates/oracle-*/**', 'scripts/mlow/**', 'specs/**', 'wasm.lock.json', 'Cargo.lock', '.github/workflows/mlow-derive.yml']
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        capture: [JgwtTQVeWPm, S_ivh1PriOA]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install corpus packaging tool
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build pinned oracle dependencies
        run: cargo build --release --locked -p oracle-cli
      - name: Test derivation and migration
        run: cargo test --release --locked -p oracle-core --lib
      - name: Re-derive every output for this capture
        run: python3 scripts/mlow/verify.py --capture '${{ matrix.capture }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlow-${{ matrix.capture }}-evidence
          path: |
            .derive-mlow/*.log
            .derive-mlow/*/manifest.json
          if-no-files-found: error
          include-hidden-files: true
